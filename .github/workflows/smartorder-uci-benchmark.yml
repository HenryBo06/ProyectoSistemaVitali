name: SmartOrder - Backtest publico UCI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/validar_publico_uci.py
      - .github/workflows/smartorder-uci-benchmark.yml

permissions:
  contents: read

jobs:
  external-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal reader
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Retrospective public transactional benchmark
        run: python scripts/validar_publico_uci.py --download-uci --output results/uci_benchmark.json
      - name: Save aggregate metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uci-public-benchmark
          path: results/uci_benchmark.json
          if-no-files-found: ignore
          retention-days: 30
