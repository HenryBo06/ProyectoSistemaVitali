name: SmartOrder CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  django-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: smartorder_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d smartorder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Django system checks and SQLite tests
        run: |
          python manage.py check
          python manage.py test operations tests --noinput
      - name: Python, JavaScript and whitespace checks
        run: |
          python -m compileall -q streamlit_app.py operations vitali_web
          node --check operations/static/operations/order.js
          git diff --check HEAD^ HEAD
      - name: PostgreSQL migration and cross-process persistence
        env:
          SMARTORDER_DATABASE_URL: postgresql://ci@127.0.0.1:5432/smartorder_ci?sslmode=disable
          SMARTORDER_SECRET_KEY: ci-ephemeral-nonproduction-key
        run: |
          python manage.py migrate --noinput
          python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE','vitali_web.settings'); import django; django.setup(); from django.contrib.auth import get_user_model; get_user_model().objects.create_user(username='ci_persistent_user')"
          python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE','vitali_web.settings'); import django; django.setup(); from django.contrib.auth import get_user_model; assert get_user_model().objects.filter(username='ci_persistent_user').exists()"
      - name: Full Django regression suite on PostgreSQL
        env:
          SMARTORDER_DATABASE_URL: postgresql://ci@127.0.0.1:5432/smartorder_ci?sslmode=disable
          SMARTORDER_SECRET_KEY: ci-ephemeral-nonproduction-key
        run: |
          python manage.py check
          python manage.py test operations tests --noinput

  cleanup-legacy-branches:
    # Deliberately runs once, on this named main integration commit, after full CI.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'cleanup legacy branches')
    needs: django-and-postgres
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete only historical refs already incorporated into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            if ! gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq '.name' >/dev/null 2>&1; then
              echo "Already removed: $branch"
              continue
            fi
            ahead="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$branch" --jq '.ahead_by')"
            if [ "$ahead" != "0" ]; then
              echo "::error::Keeping $branch because it has $ahead commits absent from main"
              exit 1
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "Removed: $branch"
          done <<'BRANCHES'
          codex/academic-ai-delivery
          codex/frontend-redesign
          codex/integracion-vitali-20261101
          codex/smartorder-densidad-20261101
          docs/documentacion-final
          feat/django-local-frontend-refresh
          fix/streamlit-demo-accounts
          fix/streamlit-persistent-postgres
          BRANCHES
