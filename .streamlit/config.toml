[theme]
base = "light"
primaryColor = "#0c6f7c"
backgroundColor = "#e7eef1"
secondaryBackgroundColor = "#dce8ec"
textColor = "#16323c"
font = "sans serif"

[server]
maxUploadSize = 20
# Django registers models once; restart after editing backend files.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
