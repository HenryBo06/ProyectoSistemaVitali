{% load l10n %}
{% if can_edit_sale or can_cancel_sale %}
<section class="panel panel-body mt-3"><h2>Editar antes de iniciar ejecución</h2>
{% if can_edit_sale %}{% for line in lines %}<form method="post" action="{% url 'sale_change' order.id %}" class="mb-3">{% csrf_token %}<input type="hidden" name="action" value="edit"><input type="hidden" name="line_id" value="{{ line.id }}"><h3>{{ line.product }}</h3><label for="qty-{{ line.id }}">Cantidad</label><input class="form-control" id="qty-{{ line.id }}" type="number" step="0.001" min="0.001" name="quantity" value="{{ line.requested_qty|unlocalize }}" required><label for="price-{{ line.id }}">Precio USD</label><input class="form-control" id="price-{{ line.id }}" type="number" step="0.001" min="0" name="unit_price" value="{{ line.unit_price|unlocalize }}" required><label for="discount-{{ line.id }}">Descuento %</label><input class="form-control" id="discount-{{ line.id }}" type="number" step="0.01" min="0" max="100" name="discount_percent" value="{{ line.discount_percent|unlocalize }}" required><label for="change-{{ line.id }}">Motivo</label><input class="form-control" id="change-{{ line.id }}" name="change_reason" maxlength="2000" required><button class="btn btn-outline-primary mt-2">Guardar cambio</button></form>{% endfor %}{% endif %}
{% if can_cancel_sale %}<form method="post" action="{% url 'sale_change' order.id %}">{% csrf_token %}<input type="hidden" name="action" value="cancel"><label for="cancel-reason">Motivo de cancelación</label><input class="form-control" id="cancel-reason" name="change_reason" maxlength="2000" required><button class="btn btn-outline-danger mt-2">Cancelar venta</button></form>{% endif %}</section>
{% endif %}
